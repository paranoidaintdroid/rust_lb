[package]
name = "rust_lb"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[dependencies]
thiserror = "1"
serde = {version = "1", features = ["derive"]}
toml = "0.8"
tokio = {version = "1.50.0", features = ["full"]}
tokio-util = "0.7.18"
httparse = "1.10.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }